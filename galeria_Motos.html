<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Motorcycle Gallery | Taller El Progreso</title>
<!-- Google Fonts: Hanken Grotesk for Headings, Inter for Body -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;800&amp;family=Inter:wght@300;400;500&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS v3 with Plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Configuration for Design System -->
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              gold: '#d4af37',
              surface: '#0c1323',
              'surface-dim': '#0c1323',
              'surface-bright': '#32394b',
              'surface-low': '#141b2c',
              'surface-lowest': '#070e1e',
            }
          },
          fontFamily: {
            heading: ['Hanken Grotesk', 'sans-serif'],
            body: ['Inter', 'sans-serif'],
          },
          borderRadius: {
            'custom': '4px', // Based on ROUND_FOUR
          },
          backgroundImage: {
            'gold-glow': 'radial-gradient(circle, rgba(212, 175, 55, 0.15) 0%, rgba(12, 19, 35, 0) 70%)',
          }
        }
      }
    }
  </script>
<style data-purpose="custom-glass-effects">
    .glass-panel {
      background: rgba(50, 57, 75, 0.4);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(212, 175, 55, 0.1);
    }
    
    .tab-active {
      color: #d4af37;
      border-bottom: 2px solid #d4af37;
      background: rgba(212, 175, 55, 0.05);
    }

    .gallery-image-container {
      transition: transform 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
    }

    .gallery-image-container:hover {
      transform: scale(1.02);
    }

    .gold-shimmer {
      position: relative;
      overflow: hidden;
    }

    .gold-shimmer::after {
      content: "";
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: linear-gradient(
        45deg,
        transparent 45%,
        rgba(212, 175, 55, 0.1) 50%,
        transparent 55%
      );
      transform: rotate(-45deg);
      animation: shimmer 6s infinite;
    }

    @keyframes shimmer {
      0% { transform: translateX(-100%) rotate(-45deg); }
      20% { transform: translateX(100%) rotate(-45deg); }
      100% { transform: translateX(100%) rotate(-45deg); }
    }

    /* Lightbox styling */
    #lightbox {
      background: rgba(7, 14, 30, 0.95);
      backdrop-filter: blur(20px);
    }
  </style>
</head>
<body class="bg-brand-surface text-gray-100 font-body antialiased">
<!-- BEGIN: MainHeader -->
<header class="sticky top-0 z-50 border-b border-brand-gold/10 glass-panel" data-purpose="header">
<div class="max-w-7xl mx-auto px-4 h-20 flex items-center justify-between">
<div class="flex items-center space-x-3">
<div class="w-10 h-10 bg-brand-gold rounded-full flex items-center justify-center shadow-[0_0_15px_rgba(212,175,55,0.4)]">
<svg class="w-6 h-6 text-brand-surface" fill="currentColor" viewbox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z"></path></svg>
</div>
<span class="font-heading font-extrabold text-xl tracking-wider text-white uppercase">Taller <span class="text-brand-gold">El Progreso</span></span>
</div>
<nav class="hidden md:flex items-center space-x-8">
<a class="text-sm font-medium hover:text-brand-gold transition-colors" href="#">Services</a>
<a class="text-sm font-medium text-brand-gold border-b border-brand-gold" href="#">Gallery</a>
<a class="text-sm font-medium hover:text-brand-gold transition-colors" href="#">About</a>
<a class="px-5 py-2 bg-brand-gold text-brand-surface font-bold text-xs uppercase tracking-widest rounded-custom hover:bg-white transition-all" href="#">Book Service</a>
</nav>
</div>
</header>
<!-- END: MainHeader -->
<!-- BEGIN: HeroSection -->
<section class="relative py-16 overflow-hidden" data-purpose="hero-section">
<div class="absolute inset-0 bg-gold-glow pointer-events-none"></div>
<div class="max-w-7xl mx-auto px-4 text-center relative z-10">
<h1 class="font-heading text-4xl md:text-6xl font-extrabold mb-4 tracking-tight">
        Mastery in <span class="text-brand-gold">Motion</span>
</h1>
<p class="max-w-2xl mx-auto text-gray-400 text-lg">
        Explore our recent transformations and high-performance maintenance projects. Quality engineering, premium finishes.
      </p>
</div>
</section>
<!-- END: HeroSection -->
<!-- BEGIN: GallerySection -->
<main class="max-w-7xl mx-auto px-4 pb-24" data-purpose="main-gallery">
<!-- Model Tabs -->
<div class="flex flex-wrap justify-center gap-2 mb-12" data-purpose="model-navigation" id="model-tabs">
<button class="model-tab px-8 py-3 rounded-custom font-heading font-semibold text-sm uppercase tracking-widest transition-all glass-panel tab-active" data-model="hunk" onclick="switchModel('hunk')">Hero Hunk 125R</button>
<button class="model-tab px-8 py-3 rounded-custom font-heading font-semibold text-sm uppercase tracking-widest transition-all glass-panel text-gray-400 hover:text-brand-gold" data-model="click" onclick="switchModel('click')">Honda Click 125i</button>
</div>
<!-- Gallery Container -->
<div class="glass-panel rounded-lg p-6 md:p-10 shadow-2xl">
<!-- Sub-Tabs: Before / After -->
<div class="flex justify-start space-x-6 border-b border-white/5 mb-8" data-purpose="state-navigation" id="sub-tabs">
<button class="state-tab pb-4 text-sm font-bold uppercase tracking-widest transition-all text-brand-gold border-b-2 border-brand-gold" data-state="after" onclick="switchState('after')">After Service</button>
<button class="state-tab pb-4 text-sm font-bold uppercase tracking-widest transition-all text-gray-500 hover:text-white" data-state="before" onclick="switchState('before')">Initial Condition</button>
</div>
<!-- Image Grid -->
<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-2 gap-6" data-purpose="image-grid" id="gallery-grid">
<!-- Images populated by JS -->
</div>
</div>
</main>
<!-- END: GallerySection -->
<!-- BEGIN: Lightbox -->
<div class="fixed inset-0 z-[100] hidden flex items-center justify-center p-4" id="lightbox" onclick="closeLightbox()">
<button class="absolute top-8 right-8 text-white hover:text-brand-gold transition-colors">
<svg class="w-10 h-10" fill="none" stroke="currentColor" viewbox="0 0 24 24"><path d="M6 18L18 6M6 6l12 12" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></svg>
</button>
<img alt="Full size view" class="max-w-full max-h-[90vh] object-contain rounded shadow-2xl border-4 border-brand-bright/20" id="lightbox-img" onclick="event.stopPropagation()" src=""/>
</div>
<!-- END: Lightbox -->
<!-- BEGIN: Footer -->
<footer class="bg-brand-surface-lowest py-12 border-t border-brand-gold/5" data-purpose="footer">
<div class="max-w-7xl mx-auto px-4 text-center">
<div class="mb-6 opacity-50">
<span class="font-heading font-extrabold text-sm uppercase tracking-[0.2em]">Taller El Progreso © 2024</span>
</div>
<div class="flex justify-center space-x-6 text-gray-500">
<a class="hover:text-brand-gold transition-colors" href="#">Instagram</a>
<a class="hover:text-brand-gold transition-colors" href="#">Facebook</a>
<a class="hover:text-brand-gold transition-colors" href="#">WhatsApp</a>
</div>
</div>
</footer>
<!-- END: Footer -->
<!-- JavaScript Functionality -->
<script data-purpose="gallery-logic">
    const galleryData = {
      hunk: {
        after: [
          { src: 'https://lh3.googleusercontent.com/aida/AP1WRLsQiczSuFJW5bJgh3j3wvPvelfe0V27zLkHH6YMG_8VU-ufh8Z09dG-13I-gr1ze9Idq1Vd9Ww_qMicyjG_ZvkCgVgGYAuNP3Xp1EUjPyN9RRvZ87c4mVPLq8zGfGGWPDhGzi0wmpwxn_b4mokJT97x3l_1GQE4lXV9GgLjdi-ODFoBhK0pZ7QJUiPhu2Krpi47TcbR9x-bgplX6VBee0_Fwg0u64ArmhTGSBMsQxESkVTfE5qLnmAtz74', title: 'Full Synthetic Treatment', desc: 'Engine optimization with Ultra Synth 0W-40.' },
          { src: 'https://lh3.googleusercontent.com/aida/AP1WRLucEobQfW0gQhBhx1yrpMtB0U98J6P6aV7oCHtgC12vxMM-uuXvYgSDz6a3gfocYjIDVSlYVyyyuNTxo9Sq275S9H1r_S4Tg6jhOp8TIlbvG6NQxJzlhyz-pS-yavFplM_vk9DrvHw5b_vOvOJSy1dR95JMGRdCQqlINaqyLeq0sVqtAdSBi2jY0ZCkptXw5tT2v0-U-I8mKIqR9Q6-JnJrFYc_Z1ltTXp4l8It0eTYVmVUicq9tPhKM2A', title: 'Ignition Upgrade', desc: 'Iridium NGK spark plugs installed for superior throttle response.' }
        ],
        before: [
          { src: 'https://placehold.co/1024x1024/0c1323/d4af37?text=Hunk+Old+Oil', title: 'Old Lubricant', desc: 'High viscosity breakdown and debris accumulation.' },
          { src: 'https://placehold.co/1024x1024/0c1323/d4af37?text=Hunk+Old+Plug', title: 'Worn Plugs', desc: 'Heavy carbon deposits and electrode erosion.' }
        ]
      },
      click: {
        after: [
          { src: 'https://lh3.googleusercontent.com/aida/AP1WRLu3VtN-PtKoAHevYbJibUmPNgLMaMjCuWkXEf5mzc1J94jaKrzNAZw_pjhYH3a1fJOX2b5MlXTMVaq30TKhQeRDXAZuvuHoxWqoC0e5jHjSMQn2UCBpZ-aXdtYYkxfIRfDldYkpAWAWKatAmGd_v7QVSGVWPCRonKS0rtksLt-oxeNuXN2CPjCAwVIS9wurUPlD48SBbrV6ZAzfivAS4VmvBvVLxKbM_zOIOCadET-eFSHFagveYrqhNfo', title: 'Suspension Overhaul', desc: 'Aurum performance shock absorbers for luxury ride quality.' },
          { src: 'https://lh3.googleusercontent.com/aida/AP1WRLss_R5Fo6hmK74RnTsLiwiHziXhaZCtUL6pUFpWPJW8QjQe8zB3YjnlGMq0W9t91Fh3ixjkV2fZZEtm5n_SkE7wDzhZX_y6ArDKJXFIiVki_jjIuSKwEG96FPQ2hxHafe2QJA4CLAHOKoTLBqpoJR0vGrbfYoW_RJyNQnOGLHAO0ilmnx_umrK6JKgiVmX333L9yaqTwnaO58jqyCLopj8ZiM0Uu-v3Bg5IMg27NGYw8seO2y0ebxEakDs', title: 'Detailing & Final Touch', desc: 'Handcrafted leather accents and premium surface protection.' }
        ],
        before: [
          { src: 'https://placehold.co/1024x1024/0c1323/d4af37?text=Click+Leaking+Shock', title: 'Leaking Suspension', desc: 'Fluid loss and compromised damping performance.' },
          { src: 'https://placehold.co/1024x1024/0c1323/d4af37?text=Click+Old+Grips', title: 'Weathered Exterior', desc: 'Visible oxidation on metallic components and worn leather.' }
        ]
      }
    };

    let currentModel = 'hunk';
    let currentState = 'after';

    function updateGallery() {
      const grid = document.getElementById('gallery-grid');
      const items = galleryData[currentModel][currentState];
      
      grid.innerHTML = '';
      
      items.forEach(item => {
        const div = document.createElement('div');
        div.className = 'gallery-image-container group relative overflow-hidden rounded-custom bg-brand-surface-lowest shadow-lg cursor-zoom-in';
        div.onclick = () => openLightbox(item.src);
        
        div.innerHTML = `
          <div class="aspect-square overflow-hidden gold-shimmer">
            <img src="${item.src}" alt="${item.title}" class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-110">
          </div>
          <div class="absolute inset-0 bg-gradient-to-t from-brand-surface-lowest via-transparent to-transparent opacity-80"></div>
          <div class="absolute bottom-0 left-0 p-6 w-full transform translate-y-2 group-hover:translate-y-0 transition-transform">
            <h3 class="font-heading font-bold text-brand-gold text-lg mb-1">${item.title}</h3>
            <p class="text-xs text-gray-300 font-medium leading-relaxed">${item.desc}</p>
          </div>
          <div class="absolute top-4 right-4 opacity-0 group-hover:opacity-100 transition-opacity">
            <div class="bg-brand-gold p-2 rounded-full text-brand-surface">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M12 4v16m8-8H4"></path></svg>
            </div>
          </div>
        `;
        grid.appendChild(div);
      });
    }

    function switchModel(model) {
      currentModel = model;
      
      // Update UI tabs
      document.querySelectorAll('.model-tab').forEach(tab => {
        if(tab.dataset.model === model) {
          tab.classList.add('tab-active', 'text-brand-gold');
          tab.classList.remove('text-gray-400');
        } else {
          tab.classList.remove('tab-active', 'text-brand-gold');
          tab.classList.add('text-gray-400');
        }
      });
      
      updateGallery();
    }

    function switchState(state) {
      currentState = state;
      
      // Update UI sub-tabs
      document.querySelectorAll('.state-tab').forEach(tab => {
        if(tab.dataset.state === state) {
          tab.classList.add('text-brand-gold', 'border-brand-gold');
          tab.classList.remove('text-gray-500');
        } else {
          tab.classList.remove('text-brand-gold', 'border-brand-gold');
          tab.classList.add('text-gray-500');
        }
      });
      
      updateGallery();
    }

    function openLightbox(src) {
      const lightbox = document.getElementById('lightbox');
      const img = document.getElementById('lightbox-img');
      img.src = src;
      lightbox.classList.remove('hidden');
      document.body.style.overflow = 'hidden';
    }

    function closeLightbox() {
      const lightbox = document.getElementById('lightbox');
      lightbox.classList.add('hidden');
      document.body.style.overflow = 'auto';
    }

    // Initialize gallery
    document.addEventListener('DOMContentLoaded', updateGallery);
  </script>
</body></html>
